name: Relay
on:
  push:
    branches: [main]
    paths: ['Services/relay/**', 'Packages/PocketDeskKit/Tests/PDProtocolTests/Fixtures/**', '.github/workflows/relay.yml']
  pull_request:
    paths: ['Services/relay/**', 'Packages/PocketDeskKit/Tests/PDProtocolTests/Fixtures/**', '.github/workflows/relay.yml']
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Services/relay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the Fly deployment image
        run: docker build -t pocketdesk-relay:test .
      - name: Validate certificate-manager configuration
        run: |
          docker run --rm --entrypoint caddy -e RELAY_HOSTNAME=relay.example.com \
            pocketdesk-relay:test adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate > /dev/null
