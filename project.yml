# XcodeGen spec. Generate the project with `xcodegen` (the .xcodeproj is gitignored).
name: PocketDesk
options:
  bundleIdPrefix: com.pocketdesk
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    # The phone app's identifiers (bundle IDs, App Group, keychain group) start with this. To
    # sign with your own team, pass a prefix you own: xcodebuild … BUNDLE_ID_PREFIX=com.you.pocketdesk
    BUNDLE_ID_PREFIX: com.pocketdesk
    CURRENT_PROJECT_VERSION: "1"
packages:
  PocketDeskKit:
    path: Packages/PocketDeskKit

targets:
  PocketDeskHost:
    type: application
    platform: macOS
    sources: [Apps/Host/Sources, Apps/Host/Assets.xcassets]
    scheme: {}
    dependencies:
      - package: PocketDeskKit
        product: PDHostCore
      # Not linked: it's loaded into /usr/bin/perl, never into the host (see NowPlaying.m).
      - target: PocketDeskNowPlaying
        link: false
        embed: true
    info:
      path: Apps/Host/Info.plist
      properties:
        CFBundleDisplayName: PocketDesk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: PocketDesk uses your local network so your phone can connect to this Mac.
        NSBonjourServices: [_pocketdesk._udp]
    settings:
      base:
        # com.pocketdesk.host by default; release builds use the prefix in Config/Release.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).host
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Input injection (CGEvent) needs a non-sandboxed app: ship notarized via Developer ID.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  # Reads what's playing for live tiles, from inside Apple's perl (see NowPlaying.m).
  PocketDeskNowPlaying:
    type: library.dynamic
    platform: macOS
    sources: [Apps/NowPlaying]
    dependencies:
      - sdk: ImageIO.framework
    settings:
      base:
        EXECUTABLE_PREFIX: ""
        PRODUCT_NAME: PocketDeskNowPlaying
        # Embedded in the host app; installing it on its own makes archives generic, not apps.
        SKIP_INSTALL: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_HARDENED_RUNTIME: YES

  PocketDesk:
    type: application
    platform: iOS
    # Lets automatic signing register the App Group for whichever team builds it.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources: [Apps/Mobile/Sources, Apps/Shared, Apps/Mobile/Assets.xcassets]
    scheme: {}
    dependencies:
      - package: PocketDeskKit
        product: PDClientCore
      - target: PocketDeskWidgets
      - target: PocketDeskShare
    info:
      path: Apps/Mobile/Info.plist
      properties:
        CFBundleDisplayName: PocketDesk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PDAppGroup: group.$(BUNDLE_ID_PREFIX).app
        UILaunchScreen: {}
        # Landscape fits a Mac display far better; the stream re-fits on rotation.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: PocketDesk finds your Mac on the local network.
        NSBonjourServices: [_pocketdesk._udp]
        NSCameraUsageDescription: Scan the pairing code shown on your Mac.
        NSFaceIDUsageDescription: PocketDesk uses Face ID to unlock Macs you've locked.
        # What the Mac is playing, on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Only the system's own TLS (Network.framework, CryptoKit): exempt, no export paperwork.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.pocketdesk.pair
            CFBundleURLSchemes: [pocketdesk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # With push (PocketDesk-Push.entitlements) only where the team allows it: see Config/Signing.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(PD_APP_ENTITLEMENTS)

  # Home Screen and Lock Screen widgets, and the Control Center control.
  PocketDeskWidgets:
    type: app-extension
    platform: iOS
    # Lets automatic signing register the App Group for whichever team builds it.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources: [Apps/Widgets/Sources, Apps/Shared]
    dependencies:
      - package: PocketDeskKit
        product: PDClientCore
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: PocketDesk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PDAppGroup: group.$(BUNDLE_ID_PREFIX).app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.widgets
        CODE_SIGN_ENTITLEMENTS: Apps/Widgets/PocketDeskWidgets.entitlements
        # Shared intents skip the work that only the app's process can do (`NowPlayingIntent`).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

  # Share sheet: sends photos and files to a Mac's Downloads folder, without opening the app.
  PocketDeskShare:
    type: app-extension
    platform: iOS
    # Lets automatic signing register the App Group for whichever team builds it.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources: [Apps/Share/Sources, Apps/Shared/DeviceOwner.swift]
    dependencies:
      - package: PocketDeskKit
        product: PDClientCore
    info:
      path: Apps/Share/Info.plist
      properties:
        CFBundleDisplayName: PocketDesk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PDAppGroup: group.$(BUNDLE_ID_PREFIX).app
        NSLocalNetworkUsageDescription: PocketDesk finds your Mac on the local network.
        NSBonjourServices: [_pocketdesk._udp]
        NSFaceIDUsageDescription: PocketDesk uses Face ID to unlock Macs you've locked.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.share
        CODE_SIGN_ENTITLEMENTS: Apps/Share/PocketDeskShare.entitlements
